<svg width="850" height="180" viewBox="0 0 850 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Accent Gradient Line -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.5"/>
    </pattern>

    <!-- Ambient Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 700;
      font-size: 32px;
      fill: #f8fafc;
      letter-spacing: -0.6px;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: #38bdf8;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 400;
      font-size: 14px;
      fill: #94a3b8;
      letter-spacing: 0.1px;
    }
    .chip-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 500;
      font-size: 11px;
      fill: #cbd5e1;
    }
  </style>

  <!-- Container Base -->
  <rect width="850" height="180" rx="12" fill="url(#bgGrad)" />
  <rect width="850" height="180" rx="12" fill="url(#grid)" />

  <!-- Ambient Light Accents -->
  <circle cx="760" cy="30" r="70" fill="#38bdf8" opacity="0.10" filter="url(#glow)" />
  <circle cx="120" cy="150" r="60" fill="#818cf8" opacity="0.08" filter="url(#glow)" />

  <!-- Border -->
  <rect x="1" y="1" width="848" height="178" rx="11" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="850" height="3" rx="1" fill="url(#accentGrad)" />

  <!-- Content Block -->
  <g transform="translate(42, 34)">
    <!-- Small Category Label -->
    <text x="0" y="0" class="badge-label">ENGENHARIA DA COMPUTAÇÃO</text>

    <!-- Full Name -->
    <text x="0" y="34" class="title">Igor Barduzzi</text>

    <!-- Subtitle -->
    <text x="0" y="60" class="subtitle">Visão Computacional  •  Inteligência Artificial Aplicada  •  Desenvolvimento Full Stack</text>

    <!-- Tech Chips Container -->
    <g transform="translate(0, 80)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="134" height="24" rx="5" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="16" class="chip-text">TypeScript • React</text>

      <!-- Chip 2 -->
      <rect x="142" y="0" width="130" height="24" rx="5" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="16" transform="translate(142, 0)" class="chip-text">Python • OpenCV</text>

      <!-- Chip 3 -->
      <rect x="280" y="0" width="138" height="24" rx="5" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="16" transform="translate(280, 0)" class="chip-text">MediaPipe • YOLO</text>

      <!-- Chip 4 -->
      <rect x="426" y="0" width="144" height="24" rx="5" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="16" transform="translate(426, 0)" class="chip-text">FastAPI • Node.js</text>

      <!-- Chip 5 -->
      <rect x="578" y="0" width="118" height="24" rx="5" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="16" transform="translate(578, 0)" class="chip-text">PostgreSQL • n8n</text>
    </g>
  </g>
</svg>
