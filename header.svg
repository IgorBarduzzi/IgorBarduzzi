<svg width="850" height="200" viewBox="0 0 850 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f2937" stroke-width="0.8" stroke-opacity="0.6"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 34px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .badge-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 15px;
      fill: #94a3b8;
    }
    .tag {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 11px;
      fill: #cbd5e1;
    }
  </style>

  <!-- Background Base -->
  <rect width="850" height="200" rx="14" fill="url(#bgGrad)" />
  <rect width="850" height="200" rx="14" fill="url(#grid)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="750" cy="40" r="80" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle cx="100" cy="160" r="70" fill="#818cf8" opacity="0.1" filter="url(#glow)" />

  <!-- Border Highlight -->
  <rect x="1" y="1" width="848" height="198" rx="13" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Left Accent Strip -->
  <rect x="0" y="25" width="4" height="150" rx="2" fill="url(#accentGrad)" />

  <!-- Content Block -->
  <g transform="translate(45, 42)">
    <!-- Category Pill / Badge -->
    <text x="0" y="0" class="badge-title">ENGENHARIA DA COMPUTAÇÃO</text>

    <!-- Main Name -->
    <text x="0" y="38" class="title">Igor Barduzzi</text>

    <!-- Subtitle / Focus -->
    <text x="0" y="66" class="subtitle">Desenvolvedor Full Stack &amp; Automação @ ByStartup  •  Visão Computacional &amp; IA</text>

    <!-- Tech Chips Container -->
    <g transform="translate(0, 88)">
      <!-- Chip 1: TypeScript & React -->
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="17" class="tag">TypeScript • React</text>

      <!-- Chip 2: Python & IA Local -->
      <rect x="138" y="0" width="138" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="152" y="17" class="tag">Python • IA Local</text>

      <!-- Chip 3: Visão Computacional -->
      <rect x="284" y="0" width="144" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="296" y="17" class="tag">OpenCV • YOLO ALPR</text>

      <!-- Chip 4: Automação & n8n -->
      <rect x="436" y="0" width="132" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="448" y="17" class="tag">n8n • Pipelines ETL</text>

      <!-- Chip 5: PostgreSQL -->
      <rect x="576" y="0" width="94" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="588" y="17" class="tag">PostgreSQL</text>
    </g>
  </g>
</svg>
